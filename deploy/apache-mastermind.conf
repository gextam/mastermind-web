# Mastermind behind Apache on a cPanel vhost, mounted at /games/mastermind.
# The Node service (systemd unit "mastermind", 127.0.0.1:8772) is started with
# MASTERMIND_BASE_PATH=/games/mastermind and strips the prefix itself, so the game,
# /games/mastermind/api/* and /games/mastermind/mcp are all proxied to it.
#
# Put these lines inside the vhost's <IfModule mod_proxy.c> block *before* any rule that
# serves /games/* as static files (see the arena.conf pattern), then
#   /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
<IfModule mod_proxy.c>
  ProxyPreserveHost On
  ProxyPassReverse /games/mastermind http://127.0.0.1:8772/games/mastermind
  RewriteEngine On
  # Mastermind owns /games/mastermind (game, API, MCP); internal subrequests are never proxied
  RewriteCond %{IS_SUBREQ} false
  RewriteRule ^/games/mastermind(/.*)?$ http://127.0.0.1:8772/games/mastermind$1 [P,L]
</IfModule>
